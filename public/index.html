<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot AI - Nemotron</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="ai-agent-container">
        
        <!-- Header Agent -->
        <header class="agent-header">
            <div class="avatar-glow">
                <div class="agent-avatar">🤖</div>
            </div>
            <div class="agent-info">
                <h1>Chatbot AI <span class="badge">Nemotron</span></h1>
                <p class="status"><span class="dot"></span> NVIDIA Nemotron Ultra</p>
            </div>
        </header>

        <!-- Area Chat -->
        <main id="chat-box" class="chat-area">
            <div class="message bot">
                <!-- Teks default diratakan dalam satu baris agar tidak menjorok ke dalam -->
                <div class="message-content">Halo! Ada yang bisa saya bantu hari ini? ✨</div>
            </div>
        </main>

        <!-- Area Input -->
        <footer class="agent-input-container">
            <form id="chat-form" class="input-wrapper">
                <input 
                    type="text" 
                    id="user-input" 
                    placeholder="Ketik pesan Anda di sini..." 
                    autocomplete="off" 
                    required
                >
                <button type="submit" id="send-btn">Kirim</button>
            </form>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
